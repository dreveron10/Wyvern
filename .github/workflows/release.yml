name: Release

# Pushing a tag like v0.1.0 or v0.1.0-test1 builds the universal JAR and
# publishes it as a GitHub release, so it can be downloaded without signing in.
# Tags with a dash (v0.1.0-test1) are marked as pre-releases.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'
      - name: Setup JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build universal JAR
        run: ./gradlew shadowJar --no-daemon
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          version=$(sed -n 's/^wyvern\.version=//p' core/src/main/resources/build.properties | tr -d '[:space:]')
          base=$(sed -n 's/^build\.version=//p' core/src/main/resources/build.properties | tr -d '[:space:]')
          cp "build/libs/OpenRocket-$base.jar" "Wyvern-$version.jar"
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "Wyvern-$version.jar" "${flags[@]}" \
            --title "Wyvern $version ($TAG)" \
            --notes "Wyvern $version, based on OpenRocket $base. Needs Java 17 or newer: run with java -jar Wyvern-$version.jar"
