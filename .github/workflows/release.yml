name: Release

# Pushing a branch named release/<tag> (for example release/v0.1.0 or
# release/v0.1.0-test1) builds the universal JAR and publishes it as a GitHub
# release with that tag, so it can be downloaded without signing in. GitHub
# creates the tag on the pushed commit. Tags with a dash are pre-releases.
on:
  push:
    branches:
      - 'release/**'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository and submodules
        uses: actions/checkout@v7.0.1
        with:
          submodules: 'recursive'
      - name: Setup JDK 17
        uses: actions/setup-java@v6.1.0
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build universal JAR
        run: ./gradlew shadowJar --no-daemon
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          TAG="${BRANCH#release/}"
          version=$(sed -n 's/^wyvern\.version=//p' core/src/main/resources/build.properties | tr -d '[:space:]')
          base=$(sed -n 's/^build\.version=//p' core/src/main/resources/build.properties | tr -d '[:space:]')
          cp "build/libs/OpenRocket-$base.jar" "Wyvern-$version.jar"
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" "Wyvern-$version.jar" "${flags[@]}" --target "$GITHUB_SHA" \
            --title "Wyvern $version ($TAG)" \
            --notes "Wyvern $version, based on OpenRocket $base. Needs Java 17 or newer: run with java -jar Wyvern-$version.jar"
