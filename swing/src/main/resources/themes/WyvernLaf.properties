# ---- Wyvern theme ----
# Loaded after FlatDarculaLaf.properties, so only the differences are listed here.
# Deep slate surfaces with an amber accent. The accent is decoration only: states
# that carry meaning (errors, warnings, CG/CP) keep their own colors and icons.

@background = #1b1f27
@foreground = #d3d8e1
@disabledForeground = #7d8594
@accentColor = #f2a33a

# Selections use a dark amber so light text stays readable on top
@selectionBackground = #5a4320
@selectionForeground = #ffffff
@selectionInactiveBackground = #2c323d
@selectionInactiveForeground = @foreground

@componentBackground = #232832
@menuBackground = #20242d

# Rounder, calmer controls
Component.arc = 8
Button.arc = 8
CheckBox.arc = 4
TextComponent.arc = 6
ProgressBar.arc = 8
Component.focusWidth = 1
Component.innerFocusWidth = 0
Component.borderColor = #3a414e
Component.focusedBorderColor = @accentColor
Component.focusColor = fade(@accentColor, 55%)

ScrollBar.width = 11
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 2,2,2,2
ScrollBar.showButtons = false

Separator.foreground = #323844
SplitPaneDivider.hoverColor = lighten(@background, 8%)

# The default button is the one filled amber control in a dialog
Button.default.background = @accentColor
Button.default.foreground = #1b1f27
Button.default.hoverBackground = lighten(@accentColor, 8%)
Button.default.pressedBackground = darken(@accentColor, 8%)
Button.default.focusedBackground = @accentColor
Button.default.borderColor = @accentColor
Button.default.focusedBorderColor = lighten(@accentColor, 15%)
Button.default.boldText = true

TabbedPane.underlineColor = @accentColor
TabbedPane.inactiveUnderlineColor = #6b5a3c
TabbedPane.hoverColor = #262b35
TabbedPane.focusColor = #2a2f3a
TabbedPane.tabHeight = 34

TitlePane.background = #151920
TitlePane.inactiveBackground = #151920
MenuBar.background = #151920

Table.gridColor = #2e343f
TableHeader.background = #232832
TableHeader.separatorColor = #3a414e
TableHeader.bottomSeparatorColor = #3a414e

ToolTip.background = #2c323d
ToolTip.border = 4,8,4,8

Tree.hash = #4a5261
Tree.selectionBackground = @selectionBackground

Slider.trackColor = #4a5261cc
Slider.thumbColor = @accentColor
Slider.trackValueColor = @accentColor

# ---- OpenRocket color keys ----
OR.colors.orange = #f2a33a

OR.ScrollPane.borderColor = #3a414ecc
OR.colors.background = #232832
OR.colors.border = #3a414e
OR.colors.text = #d3d8e1
OR.colors.text.dim = #a6aebb
OR.colors.text.disabled = #7d8594
OR.colors.textSelection.foreground = #ffffff
OR.colors.textSelection.background = #5a4320
OR.colors.row.lighter = #20242d
OR.colors.row.darker = #1b1f27
OR.colors.table.selection = #5a4320
OR.colors.flightData.textActive = #f5c27a
OR.colors.flightData.textInactive = #f5c27a80
OR.colors.url = #8fb4ff
OR.colors.componentTree.background = #232832
OR.colors.componentTree.foreground = #d3d8e1
OR.colors.fin.gridMajor = #7f8aa0b0
OR.colors.fin.gridMinor = #7f8aa040
OR.colors.monteCarlo.grid = #5b6474

OR.icons.tintColor = #f2a33a
